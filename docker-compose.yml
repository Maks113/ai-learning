services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-learning-app
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LLM_PROVIDER: local
      LOCAL_LLM_BASE_URL: http://host.docker.internal:8080/v1
      LOCAL_LLM_MODEL: Qwen/Qwen3-4B-MLX-6bit
      LOCAL_LLM_API_KEY: none
    restart: unless-stopped
